---
/**:
  robotnik_base_control:
    ros__parameters:
      # General Params
      profile: base
      debug: true
      open_loop: true

      # Timeouts
      joint_command_timeout: 0.1
      cmd_vel_timeout: 2.0

      # Odom
      odom_frame_id: $(var frame_prefix)odom
      base_frame_id: $(var frame_prefix)base_footprint
      use_2D_odom: true

      # Kinematics Params
      wheel_radius: 0.127
      wheel_base:   1.116
      track_width:  0.573

      #Cartesian and wheels limits
      base:
        linear:
          x:
            velocity:
              min: -0.5
              max: 0.5
            acceleration:
              min: -1.0
              max: 1.0
          y:
            velocity:
              min: -0.5
              max: 0.5
            acceleration:
              min: -1.0
              max: 1.0
        angular:
          z:
            velocity:
              min: -0.25
              max: 0.25
            acceleration:
              min: -1.0
              max: 1.0

        front_right:
          traction:
            joint_name: $(var frame_prefix)front_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        front_left:
          traction:
            joint_name: $(var frame_prefix)front_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        back_right:
          traction:
            joint_name: $(var frame_prefix)back_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        back_left:
          traction:
            joint_name: $(var frame_prefix)back_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

  # HAS ARM
  joint_trajectory_controller:
    ros__parameters:
      publish_rate: 50
      joints:
        - $(var frame_prefix)lift_top_joint
        - $(var frame_prefix)arm_shoulder_pan_joint
        - $(var frame_prefix)arm_shoulder_lift_joint
        - $(var frame_prefix)arm_elbow_joint
        - $(var frame_prefix)arm_wrist_1_joint
        - $(var frame_prefix)arm_wrist_2_joint
        - $(var frame_prefix)arm_wrist_3_joint

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      state_publish_rate: 50.0
      action_monitor_rate: 20.0

      allow_partial_joints_goal: false
      open_loop_control: true
