mode: pointcloud_to_laserscan
output_topic: localization/scan

pointcloud_to_laserscan:
  input_topic: top_lidar/points
  target_frame: base_link
  transform_tolerance: 0.2
  min_height: 0.0
  max_height: 1.0
  angle_min: -2.3
  angle_max: 2.3
  angle_increment: 0.008694
  range_min: 0.4
  range_max: 30.0
  use_inf: true
  inf_epsilon: 1.0
