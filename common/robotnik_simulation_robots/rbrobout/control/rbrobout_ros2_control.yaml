/**:
  controller_manager:
    ros__parameters:
      update_rate: 50
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      robotnik_base_control:
        type: robotnik_controllers/RBKairosController

  robotnik_base_control:
    ros__parameters:
      # General Params
      profile: base
      debug: true
      open_loop: true

      # Timeouts
      joint_command_timeout: 0.1
      cmd_vel_timeout: 2.0

      # Odom
      odom_frame_id: $(var frame_prefix)odom
      base_frame_id: $(var frame_prefix)base_footprint
      use_2D_odom: true

      # Kinematics Params
      wheel_radius: 0.127
      wheel_base:   1.116
      track_width:  0.573

      #Cartesian and wheels limits
      base:
        linear:
          x:
            velocity:
              min: -0.5
              max: 0.5
            acceleration:
              min: -1.0
              max: 1.0
          y:
            velocity:
              min: -0.5
              max: 0.5
            acceleration:
              min: -1.0
              max: 1.0
        angular:
          z:
            velocity:
              min: -0.25
              max: 0.25
            acceleration:
              min: -1.0
              max: 1.0

        front_right:
          traction:
            joint_name: $(var frame_prefix)front_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        front_left:
          traction:
            joint_name: $(var frame_prefix)front_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        back_right:
          traction:
            joint_name: $(var frame_prefix)back_right_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0

        back_left:
          traction:
            joint_name: $(var frame_prefix)back_left_wheel_joint
            limits:
              velocity:
                min: -27.7
                max: 27.7
              acceleration:
                min: -10.0
                max: 10.0
